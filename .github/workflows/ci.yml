name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: development
  GOOGLE_SHEETS_SPREADSHEET_ID: ""
  GOOGLE_SHEETS_SERVICE_ACCOUNT_FILE: ""

jobs:
  quality:
    name: Quality, contracts and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Verify pinned toolchain
        run: npm run check:environment

      - name: Install JavaScript and Python dependencies
        run: |
          npm ci
          npm run setup

      - name: Run database-independent checks
        run: npm run check

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: portfolio_app
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: portfolio_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio_app -d portfolio_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql+psycopg://portfolio_app:ci-password@127.0.0.1:5432/portfolio_app_test
      DATABASE_TARGET_ENVIRONMENT: development
      DATABASE_TARGET_DATABASE: portfolio_app_test
      DATABASE_LOCAL_TEST_WRITES_AUTHORIZED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Verify pinned toolchain
        run: npm run check:environment

      - name: Install JavaScript and Python dependencies
        run: |
          npm ci
          npm run setup

      - name: Select PostgreSQL 18 client tools container
        run: |
          container_id="$(docker ps --filter ancestor=postgres:18 --format '{{.ID}}' | head -n 1)"
          if [ -z "$container_id" ]; then
            echo "The disposable PostgreSQL 18 service container was not found." >&2
            exit 1
          fi
          echo "MIGRATION_PG_TOOLS_CONTAINER=$container_id" >> "$GITHUB_ENV"

      - name: Run isolated PostgreSQL tests
        run: npm run test:integration

  powershell:
    name: Windows migration command compatibility
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test Windows PowerShell 5.1 wrapper
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/tests/postgres-migration-wrapper-smoke.ps1

      - name: Test PowerShell 7 wrapper
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/tests/postgres-migration-wrapper-smoke.ps1
