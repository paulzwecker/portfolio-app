name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, contracts and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Verify pinned toolchain
        run: npm run check:environment

      - name: Install JavaScript and Python dependencies
        run: |
          npm ci
          npm run setup

      - name: Run database-independent checks
        run: npm run check

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: portfolio_app
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: portfolio_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio_app -d portfolio_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql+psycopg://portfolio_app:ci-password@127.0.0.1:5432/portfolio_app_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Verify pinned toolchain
        run: npm run check:environment

      - name: Install JavaScript and Python dependencies
        run: |
          npm ci
          npm run setup

      - name: Run isolated PostgreSQL tests
        run: npm run test:integration
