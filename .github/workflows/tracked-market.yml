name: Tracked market refresh
on:
  workflow_dispatch:
    inputs:
      history_start:
        description: Optional YYYY-MM-DD start for a one-time history import of the configured company
        type: string
        required: false
  schedule:
    - cron: "45 9 * * 1-5"
      timezone: America/New_York
    - cron: "30 10 * * 1-5"
      timezone: America/New_York
    - cron: "15 11 * * 1-5"
      timezone: America/New_York
    - cron: "0 12 * * 1-5"
      timezone: America/New_York
    - cron: "45 12 * * 1-5"
      timezone: America/New_York
    - cron: "15 14 * * 1-5"
      timezone: America/New_York
    - cron: "45 15 * * 1-5"
      timezone: America/New_York

permissions:
  contents: read

concurrency:
  group: production-tracked-market
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && vars.TRACKED_MARKET_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: tracked-market
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/api
            reference/market-data/providers
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Check US trading session
        id: session
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ -z "$SCHEDULE" ]]; then
            echo "slot=dispatch-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          else
            python -m pip install exchange-calendars==4.13.1
            python scripts/tracked_market_slot.py >> "$GITHUB_OUTPUT"
          fi
      - name: Install locked backend
        if: steps.session.outputs.slot != ''
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --no-dev --project apps/api
      - name: Refresh configured market scope
        if: steps.session.outputs.slot != ''
        env:
          HISTORY_START: ${{ inputs.history_start }}
          MARKET_SLOT: ${{ steps.session.outputs.slot }}
          MARKET_SCOPE: ${{ vars.TRACKED_MARKET_SCOPE }}
          DATABASE_URL: ${{ secrets.MARKET_DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.MARKET_NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ vars.NEON_BRANCH_ID }}
          NEON_ENDPOINT_ID: ${{ vars.NEON_ENDPOINT_ID }}
          DATABASE_TARGET_DATABASE: ${{ vars.DATABASE_TARGET_DATABASE }}
          DATABASE_TARGET_ENVIRONMENT: production
          DATABASE_PRODUCTION_WRITES_AUTHORIZED: "true"
          CLOUD_INGESTION_ENABLED: "true"
          RECURRING_OPERATIONS_ENABLED: "true"
          PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
        run: |
          : "${MARKET_SCOPE:?Configure a company UUID or all}"
          : "${DATABASE_URL:?Missing worker connection}"
          : "${NEON_API_KEY:?Missing target verification key}"
          args=(--scope market-data --refresh-slot "$MARKET_SLOT")
          if [[ "$MARKET_SCOPE" != all ]]; then args+=(--company-id "$MARKET_SCOPE"); fi
          if [[ -n "$HISTORY_START" ]]; then args+=(--history-start "$HISTORY_START"); fi
          apps/api/.venv/bin/python -m portfolio_api.cloud_cron "${args[@]}"
