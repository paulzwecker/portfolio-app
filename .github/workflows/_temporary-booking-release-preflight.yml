name: Temporary Booking release preflight verification
on:
  push:
    branches:
      - feat/api-first-company-observations

permissions:
  contents: write

jobs:
  release-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      APP_ENV: development
      GOOGLE_SHEETS_SPREADSHEET_ID: ""
      GOOGLE_SHEETS_SERVICE_ACCOUNT_FILE: ""
    steps:
      - name: Check out draft release branch
        uses: actions/checkout@v4
        with:
          ref: feat/api-first-company-observations
      - name: Set up pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up pinned Python toolchain
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install repository toolchain
        run: |
          npm ci
          npm run setup
      - name: Normalize scoped release files
        run: |
          npx prettier --write docs/release-booking-observations.md docs/deployment-and-migrations.md docs/ACTIVE_WORKSTREAM.md docs/README.md ROADMAP.md
          node scripts/uv.mjs run --locked --project apps/api ruff check --fix apps/api/src/portfolio_api/production_migration_preflight.py apps/api/tests/test_production_migration_preflight.py
          node scripts/uv.mjs run --locked --project apps/api ruff format apps/api/src/portfolio_api/production_migration_preflight.py apps/api/tests/test_production_migration_preflight.py
      - name: Check migration release preflight and deployment schema gate
        run: |
          node scripts/uv.mjs run --locked --project apps/api pytest -q apps/api/tests/test_production_migration_preflight.py
          node scripts/deployment/schema-gate.mjs review
          npm run test:deployment
      - name: Typecheck and verify normalized release formatting
        run: |
          node scripts/uv.mjs run --locked --project apps/api mypy --config-file apps/api/pyproject.toml apps/api/src apps/api/tests
          npx prettier --check docs/release-booking-observations.md docs/deployment-and-migrations.md docs/ACTIVE_WORKSTREAM.md docs/README.md ROADMAP.md
      - name: Remove disposable verifier and commit formatting only
        run: |
          git rm .github/workflows/_temporary-booking-release-preflight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style(release): normalize guarded Booking release preflight and remove verifier"
          git push origin HEAD:feat/api-first-company-observations
