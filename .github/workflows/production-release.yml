name: Coordinated production release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character main commit SHA to release
        required: true
        type: string
      run_migrations:
        description: Apply the reviewed 6c2eaf0b8147 to 9f2a6d4c81b7 migration chain
        required: true
        default: false
        type: boolean
      migration_confirmation:
        description: >-
          Required only for the initial migration: MIGRATE
          delicate-heart-04560404/br-morning-truth-b96361yh/ep-snowy-term-b9gr75j6/neondb/6c2eaf0b8147->9f2a6d4c81b7
        required: false
        default: ""
        type: string
      empty_baseline_no_recovery_confirmation:
        description: >-
          Required only when read-only preflight confirms no accepted application data:
          ACCEPT INITIAL EMPTY BASELINE WITHOUT RECOVERY
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: portfolio-production-release
  cancel-in-progress: false

jobs:
  validate_release:
    name: Verify exact main commit, CI and environment protections
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      actions: read
      deployments: read
    outputs:
      release_sha: ${{ steps.verify.outputs.release_sha }}
    steps:
      - name: Check out the requested immutable release commit
        uses: actions/checkout@v4
        with:
          # Run the validator from the trusted dispatch commit before loading
          # any user-selected release commit or production environment secret.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Verify release SHA, required checks and protected environments
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
        run: node scripts/release/verify-release.mjs

  cloud_preflight:
    name: Read-only cloud target and recovery preflight
    needs: validate_release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-readonly
    permissions:
      contents: read
      actions: read
      checks: read
      deployments: write
    outputs:
      migration_required: ${{ steps.database.outputs.migration_required }}
      recovery_required: ${{ steps.database.outputs.recovery_required }}
      production_head: ${{ steps.database.outputs.production_head }}
      repository_head: ${{ steps.database.outputs.repository_head }}
      database_host: ${{ steps.database.outputs.database_host }}
      recovery_verified: ${{ steps.database.outputs.recovery_verified }}
      render_origin: ${{ steps.providers.outputs.render_origin }}
      vercel_domain: ${{ steps.providers.outputs.vercel_domain }}
    env:
      RELEASE_SHA: ${{ needs.validate_release.outputs.release_sha }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_release.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked tooling
        run: |
          npm ci
          npm run setup

      - name: Verify Neon identity, schema and current recovery point
        id: database
        env:
          APP_ENV: development
          DATABASE_TARGET_ENVIRONMENT: production
          DATABASE_TARGET_DATABASE: neondb
          DATABASE_PRODUCTION_WRITES_AUTHORIZED: "false"
          DATABASE_URL: ${{ secrets.PRODUCTION_READONLY_DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: delicate-heart-04560404
          NEON_BRANCH_ID: br-morning-truth-b96361yh
          NEON_ENDPOINT_ID: ep-snowy-term-b9gr75j6
          RECOVERY_DATABASE_URL: ${{ secrets.RECOVERY_READONLY_DATABASE_URL }}
          RECOVERY_BRANCH_ID: ${{ vars.RECOVERY_BRANCH_ID }}
          RECOVERY_ENDPOINT_ID: ${{ vars.RECOVERY_ENDPOINT_ID }}
          CLOUD_INGESTION_ENABLED: "false"
          RECURRING_OPERATIONS_ENABLED: "false"
          MANUAL_OPERATIONS_ENABLED: "false"
          WORKBOOK_SYNC_ENABLED: "false"
          GOOGLE_SHEETS_POLL_SECONDS: "0"
          FMP_CONSENSUS_INGESTION_ENABLED: "false"
          UV_NO_SYNC: "1"
        run: node scripts/uv.mjs run --locked --project apps/api python -m portfolio_api.production_release readonly

      - name: Verify current Alembic metadata when migration is not needed
        if: steps.database.outputs.migration_required == 'false'
        env:
          APP_ENV: development
          DATABASE_TARGET_ENVIRONMENT: production
          DATABASE_TARGET_DATABASE: neondb
          DATABASE_PRODUCTION_WRITES_AUTHORIZED: "false"
          DATABASE_URL: ${{ secrets.PRODUCTION_READONLY_DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: delicate-heart-04560404
          NEON_BRANCH_ID: br-morning-truth-b96361yh
          NEON_ENDPOINT_ID: ep-snowy-term-b9gr75j6
          CLOUD_INGESTION_ENABLED: "false"
          RECURRING_OPERATIONS_ENABLED: "false"
          MANUAL_OPERATIONS_ENABLED: "false"
          WORKBOOK_SYNC_ENABLED: "false"
          GOOGLE_SHEETS_POLL_SECONDS: "0"
          FMP_CONSENSUS_INGESTION_ENABLED: "false"
          UV_NO_SYNC: "1"
        run: node scripts/uv.mjs run --locked --project apps/api python -m portfolio_api.production_release schema-check

      - name: Verify Render and Vercel projects without changing settings
        id: providers
        env:
          RENDER_READ_TOKEN: ${{ secrets.RENDER_READ_TOKEN }}
          VERCEL_READ_TOKEN: ${{ secrets.VERCEL_READ_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PRODUCTION_DOMAIN: ${{ vars.VERCEL_PRODUCTION_DOMAIN }}
          NEON_PRIMARY_DATABASE_HOST: ${{ steps.database.outputs.database_host }}
        run: node scripts/release/cloud-preflight.mjs

  release_plan:
    name: Match dispatch inputs to read-only release preflight
    needs: [validate_release, cloud_preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the validated release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_release.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Require migration and recovery inputs to match verified state
        env:
          MIGRATION_REQUIRED: ${{ needs.cloud_preflight.outputs.migration_required }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
          RECOVERY_REQUIRED: ${{ needs.cloud_preflight.outputs.recovery_required }}
          MIGRATION_CONFIRMATION: ${{ inputs.migration_confirmation }}
          EMPTY_BASELINE_NO_RECOVERY_CONFIRMATION: ${{ inputs.empty_baseline_no_recovery_confirmation }}
        run: node scripts/release/validate-approval-inputs.mjs

  owner_approval:
    name: Owner approves exact release after read-only preflight
    needs: [validate_release, cloud_preflight, release_plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-release-approval
    permissions: {}
    steps:
      - name: Record the owner authorization boundary
        run: echo "Owner approval was granted after exact-SHA and read-only cloud preflight."

  migration:
    name: Explicitly approved guarded schema migration
    needs: [validate_release, cloud_preflight, release_plan, owner_approval]
    if: needs.cloud_preflight.outputs.migration_required == 'true' && inputs.run_migrations == true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production-migration
    permissions:
      contents: read
      actions: read
      checks: read
      deployments: write
    env:
      RELEASE_SHA: ${{ needs.validate_release.outputs.release_sha }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_release.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install locked tooling
        run: |
          npm ci
          npm run setup

      - name: Confirm main has not advanced
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/assert-current-main.mjs

      - name: Reverify read-only target, reviewed base, recovery point and exact migration confirmation
        env:
          APP_ENV: development
          DATABASE_TARGET_ENVIRONMENT: production
          DATABASE_TARGET_DATABASE: neondb
          DATABASE_PRODUCTION_WRITES_AUTHORIZED: "false"
          DATABASE_URL: ${{ secrets.PRODUCTION_READONLY_DATABASE_URL }}
          MIGRATION_CONFIRMATION: ${{ inputs.migration_confirmation }}
          EMPTY_BASELINE_NO_RECOVERY_CONFIRMATION: ${{ inputs.empty_baseline_no_recovery_confirmation }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: delicate-heart-04560404
          NEON_BRANCH_ID: br-morning-truth-b96361yh
          NEON_ENDPOINT_ID: ep-snowy-term-b9gr75j6
          RECOVERY_DATABASE_URL: ${{ secrets.RECOVERY_READONLY_DATABASE_URL }}
          RECOVERY_BRANCH_ID: ${{ vars.RECOVERY_BRANCH_ID }}
          RECOVERY_ENDPOINT_ID: ${{ vars.RECOVERY_ENDPOINT_ID }}
          CLOUD_INGESTION_ENABLED: "false"
          RECURRING_OPERATIONS_ENABLED: "false"
          MANUAL_OPERATIONS_ENABLED: "false"
          WORKBOOK_SYNC_ENABLED: "false"
          GOOGLE_SHEETS_POLL_SECONDS: "0"
          FMP_CONSENSUS_INGESTION_ENABLED: "false"
          UV_NO_SYNC: "1"
        run: node scripts/uv.mjs run --locked --project apps/api python -m portfolio_api.production_release migration-preflight

      - name: Apply only the checked-in Alembic migration chain
        env:
          APP_ENV: development
          DATABASE_TARGET_ENVIRONMENT: production
          DATABASE_TARGET_DATABASE: neondb
          DATABASE_PRODUCTION_WRITES_AUTHORIZED: "true"
          DATABASE_URL: ${{ secrets.NEON_PRODUCTION_MIGRATION_DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: delicate-heart-04560404
          NEON_BRANCH_ID: br-morning-truth-b96361yh
          NEON_ENDPOINT_ID: ep-snowy-term-b9gr75j6
          CLOUD_INGESTION_ENABLED: "false"
          RECURRING_OPERATIONS_ENABLED: "false"
          MANUAL_OPERATIONS_ENABLED: "false"
          WORKBOOK_SYNC_ENABLED: "false"
          GOOGLE_SHEETS_POLL_SECONDS: "0"
          FMP_CONSENSUS_INGESTION_ENABLED: "false"
          UV_NO_SYNC: "1"
        run: |
          npm run db:migrate

      - name: Verify migrated schema metadata with read-only authority
        env:
          APP_ENV: development
          DATABASE_TARGET_ENVIRONMENT: production
          DATABASE_TARGET_DATABASE: neondb
          DATABASE_PRODUCTION_WRITES_AUTHORIZED: "false"
          DATABASE_URL: ${{ secrets.PRODUCTION_READONLY_DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: delicate-heart-04560404
          NEON_BRANCH_ID: br-morning-truth-b96361yh
          NEON_ENDPOINT_ID: ep-snowy-term-b9gr75j6
          CLOUD_INGESTION_ENABLED: "false"
          RECURRING_OPERATIONS_ENABLED: "false"
          MANUAL_OPERATIONS_ENABLED: "false"
          WORKBOOK_SYNC_ENABLED: "false"
          GOOGLE_SHEETS_POLL_SECONDS: "0"
          FMP_CONSENSUS_INGESTION_ENABLED: "false"
          UV_NO_SYNC: "1"
        run: node scripts/uv.mjs run --locked --project apps/api python -m portfolio_api.production_release schema-check

      - name: Reverify exact production head in a read-only transaction
        env:
          APP_ENV: development
          DATABASE_TARGET_ENVIRONMENT: production
          DATABASE_TARGET_DATABASE: neondb
          DATABASE_PRODUCTION_WRITES_AUTHORIZED: "false"
          DATABASE_URL: ${{ secrets.PRODUCTION_READONLY_DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: delicate-heart-04560404
          NEON_BRANCH_ID: br-morning-truth-b96361yh
          NEON_ENDPOINT_ID: ep-snowy-term-b9gr75j6
          CLOUD_INGESTION_ENABLED: "false"
          RECURRING_OPERATIONS_ENABLED: "false"
          MANUAL_OPERATIONS_ENABLED: "false"
          WORKBOOK_SYNC_ENABLED: "false"
          GOOGLE_SHEETS_POLL_SECONDS: "0"
          FMP_CONSENSUS_INGESTION_ENABLED: "false"
          UV_NO_SYNC: "1"
        run: node scripts/uv.mjs run --locked --project apps/api python -m portfolio_api.production_release readonly

  schema_gate:
    name: Stop unless database schema matches release commit
    needs:
      [
        validate_release,
        cloud_preflight,
        release_plan,
        owner_approval,
        migration,
      ]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require the exact current schema and an approved migration when needed
        env:
          PREFLIGHT_RESULT: ${{ needs.cloud_preflight.result }}
          MIGRATION_RESULT: ${{ needs.migration.result }}
          MIGRATION_REQUIRED: ${{ needs.cloud_preflight.outputs.migration_required }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
          RELEASE_VALIDATION_RESULT: ${{ needs.validate_release.result }}
          RELEASE_PLAN_RESULT: ${{ needs.release_plan.result }}
          OWNER_APPROVAL_RESULT: ${{ needs.owner_approval.result }}
        run: |
          test "$RELEASE_VALIDATION_RESULT" = success
          test "$PREFLIGHT_RESULT" = success
          test "$RELEASE_PLAN_RESULT" = success
          test "$OWNER_APPROVAL_RESULT" = success
          if [ "$MIGRATION_REQUIRED" = true ]; then
            test "$RUN_MIGRATIONS" = true
            test "$MIGRATION_RESULT" = success
          else
            test "$RUN_MIGRATIONS" = false
            test "$MIGRATION_RESULT" = skipped
          fi
          echo "The verified database schema matches the release plan."

  render_deploy:
    name: Deploy API commit to Render and verify readiness
    needs:
      [
        validate_release,
        cloud_preflight,
        release_plan,
        owner_approval,
        schema_gate,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-api
    permissions:
      contents: read
      checks: read
      deployments: write
    env:
      RELEASE_SHA: ${{ needs.validate_release.outputs.release_sha }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_release.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Deploy the exact SHA and require live API readiness
        id: deploy
        env:
          RENDER_DEPLOY_TOKEN: ${{ secrets.RENDER_DEPLOY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/render-deploy.mjs

  vercel_deploy:
    name: Build and deploy web commit to Vercel
    needs:
      [
        validate_release,
        cloud_preflight,
        release_plan,
        owner_approval,
        schema_gate,
        render_deploy,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-web
    permissions:
      contents: read
      checks: read
      deployments: write
    env:
      RELEASE_SHA: ${{ needs.validate_release.outputs.release_sha }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_release.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install pinned Vercel CLI without credentials
        run: npm install --prefix "${RUNNER_TEMP}/vercel-cli" --no-save --no-audit --no-fund vercel@24.14.0

      - name: Link the Vercel project and pull production build settings
        env:
          VERCEL_CLI_PATH: ${{ runner.temp }}/vercel-cli/node_modules/.bin/vercel
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
        run: node scripts/release/vercel-prepare.mjs

      - name: Build production web artifact without deployment credentials
        env:
          VERCEL_CLI_PATH: ${{ runner.temp }}/vercel-cli/node_modules/.bin/vercel
        run: node scripts/release/vercel-build.mjs

      - name: Deploy and verify the exact web commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_CLI_PATH: ${{ runner.temp }}/vercel-cli/node_modules/.bin/vercel
          VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PRODUCTION_DOMAIN: ${{ vars.VERCEL_PRODUCTION_DOMAIN }}
        run: node scripts/release/vercel-deploy.mjs

  smoke:
    name: Authenticated production read-only smoke tests
    needs:
      [
        validate_release,
        cloud_preflight,
        release_plan,
        owner_approval,
        render_deploy,
        vercel_deploy,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production-smoke
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_release.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Verify API readiness and authenticated web-to-API reads
        env:
          VERCEL_PRODUCTION_DOMAIN: ${{ vars.VERCEL_PRODUCTION_DOMAIN }}
          WEB_ACCESS_USERNAME: ${{ secrets.WEB_ACCESS_USERNAME }}
          WEB_ACCESS_PASSWORD: ${{ secrets.WEB_ACCESS_PASSWORD }}
        run: node scripts/release/smoke.mjs

  release_evidence:
    name: Publish sanitized release evidence
    if: always()
    needs:
      - validate_release
      - cloud_preflight
      - release_plan
      - owner_approval
      - migration
      - schema_gate
      - render_deploy
      - vercel_deploy
      - smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Write sanitized run summary
        env:
          RELEASE_SHA: ${{ needs.validate_release.outputs.release_sha }}
          VALIDATION: ${{ needs.validate_release.result }}
          PREFLIGHT: ${{ needs.cloud_preflight.result }}
          RELEASE_PLAN: ${{ needs.release_plan.result }}
          OWNER_APPROVAL: ${{ needs.owner_approval.result }}
          MIGRATION: ${{ needs.migration.result }}
          SCHEMA_GATE: ${{ needs.schema_gate.result }}
          RENDER: ${{ needs.render_deploy.result }}
          VERCEL: ${{ needs.vercel_deploy.result }}
          SMOKE: ${{ needs.smoke.result }}
          PRODUCTION_HEAD: ${{ needs.cloud_preflight.outputs.production_head }}
          REPOSITORY_HEAD: ${{ needs.cloud_preflight.outputs.repository_head }}
          RECOVERY_VERIFIED: ${{ needs.cloud_preflight.outputs.recovery_verified }}
          RECOVERY_REQUIRED: ${{ needs.cloud_preflight.outputs.recovery_required }}
        run: |
          mkdir -p release-evidence
          cat > release-evidence/release.json <<EOF
          {"release_sha":"${RELEASE_SHA}","preflight_production_head":"${PRODUCTION_HEAD}","repository_head":"${REPOSITORY_HEAD}","recovery_required":"${RECOVERY_REQUIRED}","recovery_verified":"${RECOVERY_VERIFIED}","jobs":{"validation":"${VALIDATION}","cloud_preflight":"${PREFLIGHT}","release_plan":"${RELEASE_PLAN}","owner_approval":"${OWNER_APPROVAL}","migration":"${MIGRATION}","schema_gate":"${SCHEMA_GATE}","render":"${RENDER}","vercel":"${VERCEL}","smoke":"${SMOKE}"}}
          EOF
          {
            echo "## Coordinated production release"
            echo
            echo "- Release SHA: `${RELEASE_SHA:-unavailable}`"
            echo "- Preflight schema: `${PRODUCTION_HEAD:-unavailable}` → `${REPOSITORY_HEAD:-unavailable}`"
            echo "- Recovery required: `${RECOVERY_REQUIRED:-unknown}`; recovery status: `${RECOVERY_VERIFIED:-not-required-or-blocked}`"
            echo "- Job results: validation=${VALIDATION}, preflight=${PREFLIGHT}, plan=${RELEASE_PLAN}, owner approval=${OWNER_APPROVAL}, migration=${MIGRATION}, schema=${SCHEMA_GATE}, Render=${RENDER}, Vercel=${VERCEL}, smoke=${SMOKE}"
            echo
            echo "No source values or credentials are included. Review failed job logs for sanitized reason codes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized release evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.run_id }}
          path: release-evidence/release.json
          if-no-files-found: error
          retention-days: 90
