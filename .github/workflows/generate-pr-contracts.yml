name: Temporary PR contract generation

on:
  push:
    branches:
      - feat/api-first-company-observations

permissions:
  contents: write

concurrency:
  group: generate-pr-contracts
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /apps/
            /packages/
            /scripts/
            /tools/
            /.github/
            !/apps/api/tests/test_legacy_import.py
            !/apps/api/tests/test_consensus_source_data.py
            !/apps/api/tests/test_model_input_migration.py
            !/apps/api/tests/test_model_input_parity.py
            !/apps/api/tests/test_model_migration_inventory.py
            !/apps/api/tests/test_research_rank_source_data.py
            !/apps/api/tests/test_yahoo_finance_source_data.py
            !/apps/api/tests/fixtures/p_googl_ufcf_dcf_v1.json
            !/apps/api/tests/fixtures/w_hdfc_residual_income_v1.json
            !/apps/api/tests/fixtures/w_tost_owner_cash_flow_v1.json
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          npm ci
          npm run setup

      - name: Generate API contracts
        run: npm run contracts:generate

      - name: Commit generated contracts
        shell: bash
        run: |
          if git diff --quiet -- packages/contracts/openapi.json packages/contracts/schema.d.ts; then
            echo "Generated contracts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/openapi.json packages/contracts/schema.d.ts
          git commit -m "Regenerate API contracts for company observations"
          git push origin HEAD:feat/api-first-company-observations
