name: Temporary operating drivers contract refresh (PR 42)

on:
  push:
    branches:
      - feat/api-first-company-observations
    paths:
      - .github/workflows/operating-drivers-contract-refresh-once.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'paulzwecker/portfolio-app'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install pinned toolchain
        run: |
          npm ci
          npm run setup
      - name: Format investor UI and model driver Python
        run: |
          npx prettier --write \
            apps/web/src/components/features/company/company-operating-drivers.tsx \
            apps/web/src/components/features/company/company-operating-drivers.test.tsx \
            apps/web/src/components/features/company/company-view-tabs.tsx \
            apps/web/src/components/features/company/company-explorer-workspace.tsx \
            apps/web/src/lib/domain-contracts.ts
          node scripts/uv.mjs run --locked --project apps/api ruff format \
            apps/api/src/portfolio_api/domain/schemas.py \
            apps/api/src/portfolio_api/domain/services.py \
            apps/api/src/portfolio_api/model_driver_publications.py \
            apps/api/src/portfolio_api/google_sheets_sync.py \
            apps/api/tests/test_model_publications.py
      - name: Generate contracts from FastAPI
        run: npm run contracts:generate
      - name: Commit changes to draft branch
        run: |
          git add packages/contracts/openapi.json packages/contracts/schema.d.ts \
            apps/web/src/components/features/company/company-operating-drivers.tsx \
            apps/web/src/components/features/company/company-operating-drivers.test.tsx \
            apps/web/src/components/features/company/company-view-tabs.tsx \
            apps/web/src/components/features/company/company-explorer-workspace.tsx \
            apps/web/src/lib/domain-contracts.ts \
            apps/api/src/portfolio_api/domain/schemas.py \
            apps/api/src/portfolio_api/domain/services.py \
            apps/api/src/portfolio_api/model_driver_publications.py \
            apps/api/src/portfolio_api/google_sheets_sync.py \
            apps/api/tests/test_model_publications.py
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Format operating drivers UI and regenerate model v1.3 contracts'
            git push origin HEAD:feat/api-first-company-observations
          fi
