name: Temporary operating review contract refresh (PR 42)

on:
  push:
    branches:
      - feat/api-first-company-observations
    paths:
      - .github/workflows/operating-review-refresh-once.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'paulzwecker/portfolio-app'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install pinned toolchain
        run: |
          npm ci
          npm run setup
      - name: Format new UI and backend proposals
        run: |
          npx prettier --write \
            apps/web/src/lib/domain-contracts.ts \
            apps/web/src/app/api/research/'[...path]'/route.ts \
            apps/web/src/app/api/research/'[...path]'/route.test.ts \
            apps/web/src/components/features/company/company-observation-review.tsx \
            apps/web/src/components/features/company/company-observation-review.test.tsx \
            apps/web/src/components/features/company/company-operating-drivers.tsx
          node scripts/uv.mjs run --locked --project apps/api ruff format \
            apps/api/src/portfolio_api/company_observation_proposals.py \
            apps/api/tests/test_company_observation_proposals.py
      - name: Regenerate canonical contracts
        run: npm run contracts:generate
      - name: Commit to existing draft PR branch
        run: |
          git add packages/contracts/openapi.json packages/contracts/schema.d.ts \
            apps/web/src/lib/domain-contracts.ts \
            apps/web/src/app/api/research/'[...path]'/route.ts \
            apps/web/src/app/api/research/'[...path]'/route.test.ts \
            apps/web/src/components/features/company/company-observation-review.tsx \
            apps/web/src/components/features/company/company-observation-review.test.tsx \
            apps/web/src/components/features/company/company-operating-drivers.tsx \
            apps/api/src/portfolio_api/company_observation_proposals.py \
            apps/api/tests/test_company_observation_proposals.py
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Format observation review and regenerate model driver permissions contracts'
            git push origin HEAD:feat/api-first-company-observations
          fi
