name: Reviewed holding earnings
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: Reviewed complete portfolio snapshot UUID
        required: true
        type: string
      apply_digest:
        description: Leave empty to preview, or supply the reviewed preview SHA-256
        required: false
        type: string

permissions:
  contents: read
concurrency:
  group: production-holding-earnings
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    environment: production-earnings
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install locked backend
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --no-dev --project apps/api
      - name: Verify and process private assessment batch
        env:
          ASSESSMENTS_JSON: ${{ secrets.EARNINGS_ASSESSMENTS_JSON }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ vars.NEON_BRANCH_ID }}
          NEON_ENDPOINT_ID: ${{ vars.NEON_ENDPOINT_ID }}
          DATABASE_TARGET_DATABASE: ${{ vars.DATABASE_TARGET_DATABASE }}
          DATABASE_TARGET_ENVIRONMENT: production
          PORTFOLIO_ID: ${{ vars.PORTFOLIO_ID }}
          SNAPSHOT_ID: ${{ inputs.snapshot }}
          APPLY_DIGEST: ${{ inputs.apply_digest }}
          PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          batch="$(mktemp -d)"
          trap 'rm -rf "$batch"' EXIT
          python - "$batch" <<'PY'
          import json, os, sys
          from pathlib import Path
          items = json.loads(os.environ["ASSESSMENTS_JSON"])
          if not isinstance(items, list) or not items or not all(isinstance(i, dict) for i in items):
              raise SystemExit("Configure a nonempty JSON array of reviewed assessments")
          for index, item in enumerate(items):
              (Path(sys.argv[1]) / f"{index:05d}.json").write_text(json.dumps(item))
          PY
          unset ASSESSMENTS_JSON
          args=(--portfolio "${PORTFOLIO_ID:?}" --snapshot "$SNAPSHOT_ID")
          for file in "$batch"/*.json; do args+=(--assessment "$file"); done
          export DATABASE_PRODUCTION_WRITES_AUTHORIZED=false
          if [[ -n "$APPLY_DIGEST" ]]; then
            [[ "$APPLY_DIGEST" =~ ^[0-9a-f]{64}$ ]]
            args+=(--apply-digest "$APPLY_DIGEST")
            export DATABASE_PRODUCTION_WRITES_AUTHORIZED=true
          fi
          if ! apps/api/.venv/bin/python -m portfolio_api.holding_earnings_publication "${args[@]}" 2>"$batch/errors"; then
            echo "::error::Publication failed. Check the reviewed files, snapshot, target configuration and digest."
            exit 1
          fi
