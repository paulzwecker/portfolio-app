name: Temporary observation contract refresh (PR 42)

on:
  push:
    branches:
      - feat/api-first-company-observations
    paths:
      - .github/workflows/observation-contract-refresh-once.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'paulzwecker/portfolio-app'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install pinned dependencies
        run: |
          npm ci
          npm run setup
      - name: Format changed Python
        run: |
          node scripts/uv.mjs run --locked --project apps/api ruff format \
            apps/api/src/portfolio_api/observation_sheet_sync.py \
            apps/api/tests/test_observation_sheet_sync.py \
            apps/api/src/portfolio_api/settings.py \
            apps/api/src/portfolio_api/domain/routes.py
      - name: Regenerate canonical contracts
        run: npm run contracts:generate
      - name: Commit generated files and formatting to the same draft branch
        run: |
          git add packages/contracts/openapi.json packages/contracts/schema.d.ts \
            apps/api/src/portfolio_api/observation_sheet_sync.py \
            apps/api/tests/test_observation_sheet_sync.py \
            apps/api/src/portfolio_api/settings.py \
            apps/api/src/portfolio_api/domain/routes.py
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Regenerate Sheets observation contracts and format bridge'
            git push origin HEAD:feat/api-first-company-observations
          fi
