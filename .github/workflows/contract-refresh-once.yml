name: Temporary contract regeneration (draft PR 42)

on:
  push:
    branches:
      - feat/api-first-company-observations
    paths:
      - .github/workflows/contract-refresh-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.ref == 'refs/heads/feat/api-first-company-observations'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install pinned dependencies
        run: |
          npm ci
          npm run setup
      - name: Format new shadow-pilot files
        run: |
          node scripts/uv.mjs run --locked --project apps/api \
            ruff format apps/api/src/portfolio_api/data_universe_shadow.py \
              apps/api/tests/test_data_universe_shadow.py
      - name: Generate canonical OpenAPI and TypeScript
        run: npm run contracts:generate
      - name: Commit generated files to the same draft branch
        run: |
          git add packages/contracts/openapi.json packages/contracts/schema.d.ts apps/api/src/portfolio_api/data_universe_shadow.py apps/api/tests/test_data_universe_shadow.py
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Regenerate observation proposal OpenAPI and TypeScript contracts'
            git push origin HEAD:feat/api-first-company-observations
          fi
