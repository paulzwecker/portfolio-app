name: Temporary PR42 official Alembic SQL generation
on:
  push:
    branches: [ops/pr42-alembic-schema-release]
    paths: [.github/workflows/_temporary-pr42-alembic-sql.yml]
permissions:
  contents: write
jobs:
  official-offline-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://offline:offline@localhost:5432/offline
      GOOGLE_SHEETS_SPREADSHEET_ID: ""
      GOOGLE_SHEETS_SERVICE_ACCOUNT_FILE: ""
    steps:
      - name: Checkout exact release-helper branch
        uses: actions/checkout@v4
        with:
          ref: ops/pr42-alembic-schema-release
      - name: Confirm exact merged application source
        run: |
          test "$(git merge-base HEAD 04510ec59df4cc4a15dcfd3e3a63582a499c8be9)" = "04510ec59df4cc4a15dcfd3e3a63582a499c8be9"
          git diff --exit-code "04510ec59df4cc4a15dcfd3e3a63582a499c8be9" HEAD -- apps/api/migrations apps/api/src apps/api/alembic.ini
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install pinned dependencies
        run: |
          npm ci
          npm run setup
      - name: Generate exact release SQL from Alembic offline, never connect to a DB
        run: |
          mkdir -p ops/release
          node scripts/uv.mjs run --locked --project apps/api alembic -c apps/api/alembic.ini upgrade b59f16c8a203:d7b4a6c8e2f0 --sql > ops/release/pr42-alembic-generated.sql
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          sql = Path("ops/release/pr42-alembic-generated.sql").read_text()
          actual = set(re.findall(r"CREATE TABLE\s+([a-z_][a-z_0-9]*)", sql, re.I))
          expected = {
              "company_metric_definitions",
              "company_metric_observations",
              "company_guidance_observations",
              "financial_model_driver_projections",
              "company_observation_proposals",
          }
          assert actual == expected, (actual, expected)
          assert len(re.findall(r"UPDATE\s+alembic_version", sql, re.I)) == 2
          assert not re.search(r"\b(?:DROP|TRUNCATE|DELETE|INSERT)\b", sql, re.I)
          assert "04510ec" not in sql
          assert len(sql) < 100000
          print("OFFLINE_ALEMBIC_GENERATED", "tables",len(actual),"bytes",len(sql),"sha256",hashlib.sha256(sql.encode()).hexdigest())
          PY
      - name: Retain source-exact SQL for owner-auditable Neon migration preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/release/pr42-alembic-generated.sql
          git rm .github/workflows/_temporary-pr42-alembic-sql.yml
          git commit -m "ops(release): capture exact PR42 Alembic offline SQL; remove temporary generator"
          git push origin HEAD:ops/pr42-alembic-schema-release
