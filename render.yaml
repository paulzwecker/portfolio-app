services:
  - type: web
    name: portfolio-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    rootDir: apps/api
    # Render waits for GitHub CI to pass before a main-branch deployment.
    autoDeployTrigger: checksPass
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --locked --no-dev uvicorn portfolio_api.main:app --host 0.0.0.0 --port $PORT
    # Do not route traffic to code that cannot use the current database schema.
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.13.16"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_TARGET_ENVIRONMENT
        value: production
      - key: DATABASE_TARGET_DATABASE
        value: neondb
      - key: DATABASE_PRODUCTION_WRITES_AUTHORIZED
        value: "false"
      - key: DATABASE_REHEARSAL_WRITES_AUTHORIZED
        value: "false"
      - key: NEON_API_KEY
        sync: false
      - key: NEON_PROJECT_ID
        value: delicate-heart-04560404
      - key: NEON_BRANCH_ID
        value: br-morning-truth-b96361yh
      - key: NEON_ENDPOINT_ID
        value: ep-snowy-term-b9gr75j6
      - key: API_ACCESS_TOKEN
        sync: false
      - key: CLOUD_INGESTION_ENABLED
        value: "false"
      - key: RECURRING_OPERATIONS_ENABLED
        value: "false"
      - key: MANUAL_OPERATIONS_ENABLED
        value: "false"
      - key: WORKBOOK_SYNC_ENABLED
        value: "false"
      - key: GOOGLE_SHEETS_POLL_SECONDS
        value: "0"
      - key: FMP_CONSENSUS_INGESTION_ENABLED
        value: "false"
