services:
  - type: web
    name: portfolio-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    rootDir: apps/api
    autoDeployTrigger: commit
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --locked --no-dev uvicorn portfolio_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.13.16"
      - key: DATABASE_URL
        sync: false
      - key: API_ACCESS_TOKEN
        sync: false
      - key: CLOUD_INGESTION_ENABLED
        value: "false"
      - key: RECURRING_OPERATIONS_ENABLED
        value: "false"
      - key: GOOGLE_SHEETS_POLL_SECONDS
        value: "0"
      - key: FMP_CONSENSUS_INGESTION_ENABLED
        value: "false"
